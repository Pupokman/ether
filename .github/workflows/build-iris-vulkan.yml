name: Build Iris Vulkan 26.3

on:
  push:
    branches: [ "vulkan-26.3" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout port overlay
        uses: actions/checkout@v4

      - name: Checkout Iris 26.3
        uses: actions/checkout@v4
        with:
          repository: IrisShaders/Iris
          ref: "26.3"
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Apply Vulkan overlay
        run: python3 tools/apply_overlay.py upstream

      - name: Build
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Upload Fabric build
        uses: actions/upload-artifact@v4
        with:
          name: iris-vulkan-fabric-26.3
          path: |
            upstream/build/libs/iris-fabric-*.jar
          if-no-files-found: warn

      - name: Upload NeoForge build
        uses: actions/upload-artifact@v4
        with:
          name: iris-vulkan-neoforge-26.3
          path: |
            upstream/build/libs/iris-neoforge-*.jar
          if-no-files-found: warn
